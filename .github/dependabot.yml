version: 2
updates:
  # 1. Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"

  # 2. Maintain GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # 3. Maintain Python (pip) dependencies in a subdirectory
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
